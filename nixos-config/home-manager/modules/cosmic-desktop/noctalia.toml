[shell]
lang = "ru"
font_family = "Noto Sans"
time_format = "{:%H:%M}"
date_format = "%d %B %Y"
telemetry_enabled = false
polkit_agent = false
clipboard_enabled = true
clipboard_history_max_entries = 300
clipboard_auto_paste = "off"

[shell.panel]
transparency_mode = "solid"
control_center_placement = "floating"
launcher_placement = "floating"
clipboard_placement = "floating"

[shell.animation]
enabled = true
speed = 1.2

[theme]
mode = "dark"
source = "builtin"
builtin = "Catppuccin"

[theme.templates]
enable_builtin_templates = false
enable_community_templates = false

[wallpaper]
enabled = false

[backdrop]
enabled = false

[lockscreen]
enabled = false

[idle.behavior.lock]
enabled = false

[idle.behavior.screen-off]
enabled = false

[weather]
enabled = false

[bar.main]
position = "top"
thickness = 34
background_opacity = 1.0
radius = 12
margin_ends = 8
margin_edge = 6
widget_spacing = 6
start = ["launcher", "workspaces"]
center = ["media", "clock"]
end = ["stars", "keyboard_layout", "tray", "clipboard", "network", "volume", "notifications", "control-center", "session"]

[widget.stars]
type = "custom_button"
glyph = "star"
tooltip = "Выбрать заставку с часами"
command = "cosmic-screensaver choose"

[widget.clock]
format = "{:%H:%M}"

[[shell.session.actions]]
action = "lock"
command = "cosmic-shell lock"
label = "Блокировка"

[[shell.session.actions]]
action = "suspend"
command = "systemctl suspend"
label = "Сон"
countdown_seconds = 3.0

[[shell.session.actions]]
action = "reboot"
command = "systemctl reboot"
label = "Перезапуск"
countdown_seconds = 5.0

[[shell.session.actions]]
action = "shutdown"
command = "systemctl poweroff"
label = "Выключение"
countdown_seconds = 5.0
